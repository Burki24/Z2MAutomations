name: Tests

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Run shared module tests
        uses: Burki24/Symcon_ModuleCI/php-tests@v1.0.0
        with:
          php-version: '8.5'
          test-command: php tests/run.php
