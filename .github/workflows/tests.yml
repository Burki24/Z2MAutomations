name: Tests

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Set up Node for extension tests
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned extension test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run shared module tests
        uses: Burki24/Symcon_ModuleCI/php-tests@main
        with:
          php-version: '8.5'
          test-command: php tests/run.php
